name: GroomerBook
options:
  bundleIdPrefix: com.zeronelabs
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "FZYVPK6336"
    CODE_SIGN_STYLE: Automatic

targets:
  GroomerBook:
    type: application
    platform: iOS
    sources:
      - path: GroomerBook
      - path: Shared
    info:
      path: GroomerBook/Info.plist
      properties:
        CFBundleDisplayName: GroomerBook
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeronelabs.groomerbook
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  GroomerBook:
    build:
      targets:
        GroomerBook: all
    run:
      config: Debug
    archive:
      config: Release
